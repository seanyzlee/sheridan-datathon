[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "resil_hpc"
version = "0.1.0"
description = "C++ OpenMP simulation core for the Resilience Rewired engine"
requires-python = ">=3.10"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.license-files = []
